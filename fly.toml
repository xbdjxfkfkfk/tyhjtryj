# fly.toml app configuration file generated for discord-guard-xbdjxfkfkfk on 2026-10-31T00:07:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discord-guard-xbdjxfkfkfk'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
